name: Update
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this
        uses: actions/checkout@v6
      - name: Make temp
        run: "mkdir ./temp"
      - name: Checkout Cyrus
        run: git checkout https://github.com/CyrusCraft/Cyrus.git
        working-directory: "./temp"
      - name: make executable
        run: chmod -x ./gradlew
        working-directory: "temp/"
      - name: Build docs
        run: ./gradlew docs
        working-directory: "temp/"
      - name: Move API docs
        run: mv ./temp/api/build/docs/ ./Docs/API
      - name: Cleanup
        run: rm -r ./temp
      - name: Commit changes
        uses: actions-x/commit@v6
          
      

