name: Update
on:
  workflow_dispatch:
permissions: write-all
jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout this
        uses: actions/checkout@v6
      - name: Make temp
        run: "mkdir ./temp"
      - name: make to
        run: "mkdir ./Docs/API"
      - name: Checkout Cyrus
        uses: actions/checkout@v6
        with:
          repository: CyrusCraft/Cyrus
          ref: main
          token: ${{ secrets.CYRUS_READ_ONLY }}
          path: "./temp"
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build docs
        run: ./gradlew javadoc
        working-directory: "./temp"
      - name: Move API docs
        run: move ./temp/api/build/docs/javadoc/ ./Docs/API
      - name: Cleanup
        run: rmdir /S ./temp
      - name: Commit changes
        uses: actions-x/commit@v6
          
      

