name: Update
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this
        uses: actions/checkout@v6
      - name: Checkout Cyrus
        uses: actions/checkout@v6
        with:
          repository: CyrusCraft/Cyrus
          ref: "main"
          path: "temp"
      - name: make executable
        run: chmod -x ./gradlew
        working-directory: "temp/"
      - name: Build docs
        run: ./gradlew docs
        working-directory: "temp/"
      - name: Move API docs
        run: mv ./temp/api/build/docs/ ./Docs/API
      - name: Cleanup
        run: rm -r ./temp
      - name: Commit changes
        uses: actions-x/commit@v6
          
      

